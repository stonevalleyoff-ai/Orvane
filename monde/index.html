<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121a17">
<title>Orvane — observatoire</title>
<!-- Orvane — L'OBSERVATOIRE (monde/index.html)
     Ce que vit un monde Orvane : ses espèces, ses biomes, ses lignées, ce qui s'est passé cette nuit ; et une simulation
     locale (le moteur tourne dans le navigateur, le monde publié n'est jamais touché). Un seul fichier, zéro dépendance :
     le moteur et le tampon sont chargés depuis ../moteur et ../tampon. Les mondes : ../mondes/liste.json.
     Adresse partageable : ?monde=<id>&vue=<vue>&espece=<id>. -->
<style>
:root {
  --fond:#121a17; --surface:#18221e; --surface2:#1f2b26; --ligne:#2d3b35; --texte:#e9efe6; --sourd:#97a69d;
  --ambre:#e0a54a; --vif:#8fcf8a; --declin:#e58a73; --eau:#82b9cb;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing:border-box; }
html, body { margin:0; background:var(--fond); color:var(--texte); font:15px/1.5 var(--sans); -webkit-text-size-adjust:100%; }
a { color:var(--ambre); }
button, select, input { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--ambre); outline-offset:2px; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.sourd { color:var(--sourd); } .vif { color:var(--vif); } .declin { color:var(--declin); } .ambre { color:var(--ambre); }
.n { font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }

/* l'en-tête : le monde, son cycle, et les vues sur une seule ligne qui défile */
.tete { position:sticky; top:0; z-index:5; background:var(--fond); border-bottom:1px solid var(--ligne); padding:max(8px, env(safe-area-inset-top)) 14px 0; }
.ligne1 { display:flex; align-items:center; gap:10px; max-width:1180px; margin:0 auto; }
.marque { font:600 19px/1 var(--serif); letter-spacing:.02em; color:var(--texte); text-decoration:none; }
.monde select { background:var(--surface); border:1px solid var(--ligne); border-radius:8px; padding:6px 28px 6px 10px; max-width:52vw; appearance:none;
  background-image:linear-gradient(45deg, transparent 50%, var(--sourd) 50%), linear-gradient(135deg, var(--sourd) 50%, transparent 50%); background-position:calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size:5px 5px; background-repeat:no-repeat; }
.cycle { margin-left:auto; color:var(--sourd); font-size:13px; text-align:right; line-height:1.25; }
.cycle b { color:var(--texte); font-weight:600; }
nav { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; max-width:1180px; margin:6px auto 0; }
nav::-webkit-scrollbar { display:none; }
nav button { background:none; border:0; border-bottom:2px solid transparent; padding:8px 10px 9px; color:var(--sourd); white-space:nowrap; cursor:pointer; }
nav button[aria-current="page"] { color:var(--texte); border-bottom-color:var(--ambre); }
#bandeau { max-width:1180px; margin:0 auto; padding:0 14px; }
#bandeau p { margin:10px 0 0; padding:8px 12px; border-radius:8px; background:var(--surface2); font-size:14px; }
#bandeau p.erreur { border-left:3px solid var(--declin); } #bandeau p.local { border-left:3px solid var(--ambre); }
#bandeau button { background:none; border:0; color:var(--ambre); text-decoration:underline; cursor:pointer; padding:0; }

main { max-width:1180px; margin:0 auto; padding:6px 14px 60px; }
h1, h2, h3 { font-family:var(--serif); font-weight:600; letter-spacing:.01em; }
h2 { font-size:19px; margin:26px 0 10px; }
h3 { font-size:16px; margin:20px 0 6px; }
.grille2 > *, .especes > * { min-width:0; }
.grille2 { display:grid; gap:0 34px; } @media (min-width:900px) { .grille2 { grid-template-columns:1fr 1fr; } }
.phrase { font:400 18px/1.5 var(--serif); margin:16px 0 4px; max-width:62ch; }
.chiffres { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:0; margin:14px 0 0; border-top:1px solid var(--ligne); border-bottom:1px solid var(--ligne); }
.chiffres div { padding:10px 12px 10px 0; } .chiffres dt { color:var(--sourd); font-size:13px; } .chiffres dd { margin:0; font-size:22px; font-variant-numeric:tabular-nums; }
.vide { color:var(--sourd); border:1px dashed var(--ligne); border-radius:10px; padding:14px; margin:6px 0; }
.lien { background:none; border:0; color:var(--ambre); padding:6px 0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }

/* le classement : une ligne par espèce, son nom comme sur une planche */
.classement { list-style:none; padding:0; margin:0; }
.classement button { width:100%; display:grid; grid-template-columns:12px minmax(0, 1fr) 72px auto; align-items:center; gap:10px; background:none; border:0; border-bottom:1px solid var(--ligne); padding:8px 0; text-align:left; cursor:pointer; }
.classement button:hover .nom { color:var(--ambre); }
.pt { width:10px; height:10px; border-radius:50%; display:inline-block; }
.nom { font:italic 400 16px/1.3 var(--serif); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.jauge { height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; } .jauge span { display:block; height:100%; background:var(--eau); }
.chiffre { display:flex; flex-direction:column; align-items:flex-end; font-variant-numeric:tabular-nums; min-width:70px; } .chiffre small { font-size:12px; }

/* les événements du cycle */
.evts { list-style:none; padding:0; margin:0; } .evts li { padding:7px 0; border-bottom:1px solid var(--ligne); display:flex; gap:10px; align-items:baseline; }
.evts .combien { font-variant-numeric:tabular-nums; min-width:28px; text-align:right; color:var(--ambre); font-weight:600; }
.evts .qui { color:var(--sourd); font-size:13px; }

/* les biomes : une fiche par sol */
.biomes { display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); }
.biome { background:var(--surface); border-radius:10px; padding:12px 14px; }
.biome h3 { margin:0; font-size:16px; } .biome .milieu { color:var(--sourd); font-size:13px; }
.biome .occ { display:flex; justify-content:space-between; font-size:13px; color:var(--sourd); margin:10px 0 4px; }
.biome ul { list-style:none; padding:0; margin:8px 0 0; font-size:14px; } .biome li { display:flex; justify-content:space-between; gap:8px; padding:2px 0; } .biome li i { font-family:var(--serif); }

/* les espèces : le registre et la fiche */
.especes { display:grid; gap:24px; } @media (min-width:900px) { .especes { grid-template-columns:340px minmax(0, 1fr); } .especes .retour { display:none; } }
@media (max-width:899px) { .especes.ouverte .registre { display:none; } .especes:not(.ouverte) .fiche { display:none; } }
.registre { position:relative; }
@media (min-width:900px) { .registre { position:sticky; top:96px; max-height:calc(100vh - 110px); display:flex; flex-direction:column; } .registre > * { flex-shrink:0; } .registre .liste { flex:1 1 auto; min-height:0; overflow-y:auto; } }
.cherche { width:100%; background:var(--surface); border:1px solid var(--ligne); border-radius:8px; padding:9px 12px; margin-top:14px; }
.filtres { display:flex; gap:6px; overflow-x:auto; padding:10px 0 6px; scrollbar-width:none; } .filtres::-webkit-scrollbar { display:none; }
.puce { background:var(--surface); border:1px solid var(--ligne); border-radius:999px; padding:5px 11px; font-size:13px; cursor:pointer; white-space:nowrap; }
.puce[aria-pressed="true"] { background:var(--texte); color:var(--fond); border-color:var(--texte); }
.tri { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--sourd); padding:4px 0 8px; }
.tri select { background:var(--surface); border:1px solid var(--ligne); border-radius:6px; padding:3px 6px; }
.liste { list-style:none; padding:0; margin:0; }
.liste button { width:100%; display:grid; grid-template-columns:58px minmax(0, 1fr) auto; gap:10px; align-items:center; background:none; border:0; border-bottom:1px solid var(--ligne); padding:6px 4px; text-align:left; cursor:pointer; border-radius:6px; }
.liste button[aria-current="true"] { background:var(--surface2); }
.liste svg { width:58px; height:31px; }
.liste .sous { display:block; color:var(--sourd); font-size:12px; }
.etiq { font-size:12px; border-radius:4px; padding:1px 6px; background:var(--surface2); color:var(--sourd); white-space:nowrap; }
.etiq.vif { color:var(--vif); } .etiq.declin { color:var(--declin); }
.retour { margin-top:12px; }
.fiche header { display:grid; grid-template-columns:minmax(0, 1fr); gap:6px 18px; align-items:center; margin-top:10px; }
@media (min-width:560px) { .fiche header { grid-template-columns:200px minmax(0, 1fr); } }
.fiche header svg { width:100%; max-width:240px; height:auto; background:var(--surface); border-radius:10px; }
.fiche h1 { font:italic 600 26px/1.15 var(--serif); margin:0; }
.fiche .ident { color:var(--sourd); font-size:13px; margin-top:4px; }
.fiche .ident button { background:none; border:0; padding:0; color:var(--ambre); text-decoration:underline; cursor:pointer; font-size:13px; }
.faits { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); margin:14px 0 0; border-top:1px solid var(--ligne); }
.faits div { padding:8px 10px 8px 0; border-bottom:1px solid var(--ligne); } .faits dt { color:var(--sourd); font-size:12px; } .faits dd { margin:0; }
.defile { overflow-x:auto; -webkit-overflow-scrolling:touch; }
table { width:100%; border-collapse:collapse; font-size:14px; } th, td { padding:6px 8px 6px 0; border-bottom:1px solid var(--ligne); text-align:left; vertical-align:top; } th { color:var(--sourd); font-weight:400; font-size:13px; }
td.n, th.n { text-align:right; }
.note { color:var(--sourd); font-size:13px; margin:6px 0 0; max-width:70ch; }
.trait { padding:8px 0; border-bottom:1px solid var(--ligne); } .trait b { font-weight:600; } .trait p { margin:2px 0 0; color:var(--sourd); font-size:14px; }
.trait .presage { color:var(--texte); font-style:italic; font-family:var(--serif); }
canvas { width:100%; display:block; }
.leg { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:13px; color:var(--sourd); margin:8px 0 0; padding:0; list-style:none; }
.leg button { background:none; border:0; padding:2px 0; color:inherit; cursor:pointer; } .leg button[aria-pressed="false"] { opacity:.4; text-decoration:line-through; }
.leg i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }

/* qui mange qui, en toutes lettres */
.mange { list-style:none; padding:0; margin:0; } .mange li { padding:7px 0; border-bottom:1px solid var(--ligne); } .mange .proies { color:var(--sourd); font-size:14px; }
/* le journal */
.cycleJ { margin:18px 0 4px; font:600 15px var(--serif); color:var(--sourd); }
.evt { padding:6px 0; border-bottom:1px solid var(--ligne); } .evt b { font-weight:600; } .evt .det { color:var(--sourd); }

/* simuler */
.actions { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
.bouton { background:var(--surface2); border:1px solid var(--ligne); border-radius:8px; padding:9px 14px; cursor:pointer; }
.bouton.principal { background:var(--ambre); border-color:var(--ambre); color:#1d1406; font-weight:600; }
.bouton:disabled { opacity:.45; cursor:default; }
.progres { height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; margin:8px 0; } .progres span { display:block; height:100%; background:var(--ambre); width:0; }
.champ { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:8px 0; font-size:14px; }
@media (prefers-reduced-motion:no-preference) { .progres span { transition:width .15s; } }
</style>
</head>
<body>
<header class="tete">
  <div class="ligne1">
    <a class="marque" href="./">Orvane</a>
    <label class="monde"><span class="sr">Monde affiché</span><select id="choixMonde"></select></label>
    <span class="cycle" id="etatCycle"></span>
  </div>
  <nav id="nav" aria-label="Vues">
    <button data-v="vue">Vue d'ensemble</button><button data-v="especes">Espèces</button><button data-v="lignees">Lignées</button><button data-v="chaine">Chaîne alimentaire</button><button data-v="journal">Journal</button><button data-v="simuler">Simuler</button>
  </nav>
</header>
<div id="bandeau" role="status" aria-live="polite"></div>
<main id="contenu"><p class="vide">Chargement du monde…</p></main>
<input type="file" id="fInst" accept=".json" hidden><input type="file" id="fLot" accept=".json" hidden><input type="file" id="fProfil" accept=".json" hidden>
<script src="../moteur/catalogue.js"></script>
<script src="../moteur/corps.js"></script>
<script src="../moteur/orvane.js"></script>
<script src="../tampon/tampon.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const ESC = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const COUL = ['#e0a54a', '#82b9cb', '#8fcf8a', '#e58a73', '#b9a2e0', '#d8c36a', '#6fc7b8', '#e59ab9', '#a9c46f', '#8fa0e0', '#c9a27a', '#7fd1a0'];
const AXES = ['temperature', 'humidite', 'altitude', 'lumiere', 'couvert'];
const MONDES_CONNUS = [{ id: 'sv-1', nom: 'Monde de Stone Valley' }, { id: 'genese-7', nom: 'Monde né d\'Orvane' }];
// l'état de la page : l'histoire (un instantané par cycle), ce qui vient du monde publié, ce que fait la personne
const E = { H: [], publies: 0, source: null, gen0: null, profil: null, lot: null, tampon: {}, pressions: null, mondes: MONDES_CONNUS,
  vue: 'vue', espece: null, ouverte: false, filtre: 'toutes', tri: 'effectif', recherche: '', biome: null, journal: 'tous', cache: new Set(), enCours: false, arret: false };
const inst = () => E.H[E.H.length - 1];
const couleur = (() => { const m = new Map(); return id => { if (!m.has(id)) m.set(id, COUL[m.size % COUL.length]); return m.get(id); }; })();
const nb = v => Math.round(v).toLocaleString('fr-FR');
const fx = (v, d = 2) => typeof v === 'number' ? v.toLocaleString('fr-FR', { maximumFractionDigits: d }) : (v ?? '—');
const tend = v => Math.abs(v || 0) < .005 ? '<span class="sourd">stable</span>' : `<span class="${v > 0 ? 'vif' : 'declin'}">${v > 0 ? '+' : '−'}${Math.round(Math.abs(v) * 100) || '<1'} %</span>`;
const PART_K = { herbivore: 1, omnivore: 1, detritivore: .3, filtreur: .3, carnivore: 0 };   // ce que chaque régime pèse sur le sol (moteur/orvane.js)
const pct = v => v == null ? '—' : (v * 100).toLocaleString('fr-FR', { maximumFractionDigits: v > 0 && v < .01 ? 2 : v < .1 ? 1 : 0 }) + ' %';
const effectif = t => t.populations.reduce((a, p) => a + p.effectif, 0);
const tendance = t => { const W = effectif(t); return W ? t.populations.reduce((a, p) => a + p.effectif * (p.tendance || 0), 0) / W : 0; };
const vivants = I => I.taxons.filter(t => !t.eteint);
const nomEsp = t => t ? (t.nom || t.id) : '';
const nomBiome = id => inst()?.biomes.find(b => b.id === id)?.nom || id;
const STATUT = { croissance: ['en croissance', 'vif'], stable: ['stable', ''], declin: ['en déclin', 'declin'], menace: ['menacée', 'declin'], eteint: ['éteinte', 'declin'] };
const REGIME = { herbivore: 'herbivore', omnivore: 'omnivore', carnivore: 'carnivore', filtreur: 'filtreur', detritivore: 'détritivore' };
const EVT = { apparition: ['apparition', 'apparitions'], extinction: ['extinction', 'extinctions'], separation: ['nouvelle lignée', 'nouvelles lignées'], migration: ['population installée ailleurs', 'populations installées ailleurs'],
  effondrement: ['effondrement', 'effondrements'], explosion: ['explosion démographique', 'explosions démographiques'], nouveau_trait: ['trait nouveau', 'traits nouveaux'],
  epidemie: ['épidémie', 'épidémies'], remission: ['épidémie éteinte', 'épidémies éteintes'], catastrophe: ['catastrophe', 'catastrophes'] };
const evtNom = (type, n = 1) => (EVT[type] || [type, type])[n > 1 ? 1 : 0];
const bandeau = (html, cls = '') => { $('#bandeau').innerHTML = html ? `<p class="${cls}">${html}</p>` : ''; };

// --- l'adresse : ?monde=&vue=&espece= (partageable, et rechargée telle quelle) ---
function adresse() {
  const q = new URLSearchParams(); if (E.source?.id) q.set('monde', E.source.id); if (E.vue !== 'vue') q.set('vue', E.vue); if (E.vue === 'especes' && E.espece) q.set('espece', E.espece);
  history.replaceState(null, '', '?' + q.toString());
}

// --- charger un monde ---
async function json(url) { const r = await fetch(url, { cache: 'no-cache' }); if (!r.ok) throw new Error(r.status === 404 ? 'introuvable' : 'HTTP ' + r.status); return r.json(); }
async function listeMondes() { try { const L = await json('../mondes/liste.json'); if (Array.isArray(L) && L.length) E.mondes = L; } catch (e) { } remplirChoix(); }
function remplirChoix() {
  const s = $('#choixMonde'), cur = E.source?.id || '';
  s.innerHTML = E.mondes.map(m => `<option value="${ESC(m.id)}">${ESC(m.nom || m.id)}</option>`).join('')
    + (E.source && !E.mondes.some(m => m.id === E.source.id) ? `<option value="${ESC(E.source.id)}">${ESC(E.source.nom)}</option>` : '')
    + `<option value=":exemple">Exemple (fictif)</option><option value=":fichier">Ouvrir un fichier…</option>`;
  s.value = cur || (E.mondes[0]?.id ?? '');
}
$('#choixMonde').onchange = e => { const v = e.target.value; if (v === ':fichier') { $('#fInst').click(); remplirChoix(); } else if (v === ':exemple') exemple(); else monde(v); };
function installer(H, source, gen0, profil) {
  E.H = H; E.publies = H.length; E.source = source; E.gen0 = gen0 || null; if (profil) E.profil = profil; E.tampon = {}; E.pressions = null; E.cache = new Set();
  if (!inst().taxons.some(t => t.id === E.espece)) { E.espece = null; E.ouverte = false; }
  if (!inst().biomes.some(b => b.id === E.biome)) E.biome = null;
  remplirChoix(); bandeau(''); rendre();
}
async function monde(id) {
  $('#contenu').innerHTML = '<p class="vide">Chargement du monde…</p>';
  try {
    const courant = await json(`../mondes/${encodeURIComponent(id)}/instantane.json`);
    const [hist, profil, gen0] = await Promise.all([json(`../mondes/${id}/historique.json`).catch(() => []), json(`../mondes/${id}/profil.json`).catch(() => null), json(`../mondes/${id}/generation-0.json`).catch(() => null)]);
    installer([...hist.filter(h => h.cycle.n < courant.cycle.n), courant], { id, nom: courant.monde.nom || id, publie: true }, gen0, profil);
  } catch (e) {
    $('#contenu').innerHTML = `<p class="vide">Le monde « ${ESC(id)} » ne s'ouvre pas (${ESC(e.message)}). Vérifiez qu'il est publié dans <code>mondes/${ESC(id)}/</code>, ou choisissez-en un autre en haut.</p>`;
    bandeau(`Monde « ${ESC(id)} » introuvable.`, 'erreur');
  }
}
async function exemple() {
  let I; try { I = await json('../schemas/exemples/instantane.json'); } catch (e) { I = JSON.parse($('#exemple').textContent); }
  installer([I], { id: null, nom: 'Exemple (fictif)', publie: false }, null, null); bandeau('Un monde inventé pour l\'exemple : deux espèces, deux biomes.', 'local');
}
function lireFichier(input, cb) { input.addEventListener('change', () => { const f = input.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => cb(r.result, f.name); r.readAsText(f); input.value = ''; }); }
lireFichier($('#fInst'), (t, nom) => { try { const I = JSON.parse(t); if (!I.taxons || !I.biomes) throw new Error('ce n\'est pas un instantané'); installer([I], { id: null, nom, publie: false }, null, null); bandeau(`Fichier « ${ESC(nom)} » ouvert.`, 'local'); } catch (e) { bandeau(`« ${ESC(nom)} » ne se lit pas : ${ESC(e.message)}.`, 'erreur'); } });
lireFichier($('#fLot'), t => { try { E.lot = JSON.parse(t); E.tampon = {}; rendre(); } catch (e) { bandeau('Ce lot ne se lit pas.', 'erreur'); } });
lireFichier($('#fProfil'), t => { try { E.profil = JSON.parse(t); rendre(); } catch (e) { bandeau('Ce profil ne se lit pas.', 'erreur'); } });

// --- l'en-tête et la navigation ---
function entete() {
  const I = inst(); if (!I) return; const s = I.cycle.saison, local = E.H.length - E.publies;
  $('#etatCycle').innerHTML = `cycle <b>${I.cycle.n}</b>${s ? ` · ${s.nom}` : ''}${local > 0 ? `<br><span class="ambre">+${local} simulé${local > 1 ? 's' : ''}</span>` : ''}`;
  $$('#nav button').forEach(b => { if (b.dataset.v === E.vue) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
}
$$('#nav button').forEach(b => b.onclick = () => { E.vue = b.dataset.v; rendre(); scrollTo(0, 0); });
function aller(vue, espece) { E.vue = vue; if (espece) { E.espece = espece; E.ouverte = true; } rendre(); scrollTo(0, 0); }
document.addEventListener('click', e => { const b = e.target.closest('[data-esp]'); if (b) { aller('especes', b.dataset.esp); return; } const a = e.target.closest('[data-aller]'); if (a) aller(a.dataset.aller); });

function rendre() {
  if (!E.H.length) return; entete(); adresse();

// La silhouette d'une lignée (plan.corps, moteur/corps.js), de profil : de quoi la reconnaître d'un coup d'œil.

  if (c.forme === 'serpent') { let d = ''; for (let i = 0; i <= 12; i++) { const x = 20 + i * 9, y = sol - 8 - Math.sin(i * .9) * 5; d += (i ? 'L' : 'M') + x + ' ' + y; }
    E2.push(`<path d="${d}" stroke="${rgb(C.robe)}" stroke-width="${Th * .8}" fill="none" stroke-linecap="round"/>`, `<circle cx="132" cy="${sol - 12}" r="${Th * .55}" fill="${rgb(C.robe)}"/>`, `<circle cx="136" cy="${sol - 14}" r="2" fill="${rgb(C.oeil)}"/>`);
    return `<svg viewBox="0 0 170 90" width="170" height="90" aria-hidden="true">${E2.join('')}</svg>`; }
  if (c.queue > .08) { const L = (.06 + c.queue * .42) * k; E2.push(`<path d="M${xr + 4} ${cy - Th * .1} Q${xr - L * .5} ${cy - Th * .2 - (traits.includes('queue-prehensile') ? L * .4 : 0)} ${xr - L} ${cy + (bip ? 4 : -L * .25)}" stroke="${rgb(C.robe)}" stroke-width="${Th * .35}" fill="none" stroke-linecap="round"/>`); }

  if (c.carapace > .3) E2.push(`<path d="M${xr + 3} ${cy - 2} Q${cx} ${cy - Th * .9 - c.carapace * 6} ${xa - 3} ${cy - 2}Z" fill="${rgb(C.sombre)}"/>`);
  if (c.motif === 'rayures' || traits.includes('coloration-aposematique')) for (let i = 0; i < 4; i++) E2.push(`<line x1="${xr + 8 + i * Lt / 5}" y1="${cy - Th / 2}" x2="${xr + 6 + i * Lt / 5}" y2="${cy + Th / 4}" stroke="${traits.includes('coloration-aposematique') ? '#e8bc2a' : rgb(C.sombre)}" stroke-width="3"/>`);

  if (c.motif === 'bandes') E2.push(`<line x1="${xr + 4}" y1="${cy - Th * .3}" x2="${xa - 4}" y2="${cy - Th * .3}" stroke="${rgb(C.sombre)}" stroke-width="3"/>`);

}

// === LIGNÉES : qui descend de qui, et quand ===
function vueLignees() {
  const I = inst(), T = I.taxons;
  $('#contenu').innerHTML = `<h2>L'arbre des lignées</h2><p class="note">Chaque trait est une espèce, de son apparition à aujourd'hui (ou à son extinction, †). Les pointillés relient une lignée à celle dont elle s'est séparée. Touchez une ligne pour ouvrir l'espèce.</p><div class="defile"><canvas id="cArbre" height="360" style="min-width:560px"></canvas></div>`;
  const c = $('#cArbre'), c0 = Math.min(...T.map(t => t.apparu), E.H[0].cycle.n), c1 = I.cycle.n;
  const enfants = id => T.filter(t => t.parent === id), racines = T.filter(t => !t.parent || !T.some(z => z.id === t.parent));
  const lignes = []; (function poser(liste) { for (const t of liste.slice().sort((a, b) => a.apparu - b.apparu)) { lignes.push(t); poser(enfants(t.id)); } })(racines);
  const pas = 26; c.setAttribute('height', Math.max(200, pas * lignes.length + 40));
  const [x, w, h] = toile(c), m = { g: 12, d: 16, h: 16, b: 24 }, X = n => m.g + (w - m.g - m.d) * (n - c0) / Math.max(1, c1 - c0), Y = i => m.h + pas * (i + .5), rang = new Map(lignes.map((t, i) => [t.id, i]));
  x.strokeStyle = CS.grille; x.fillStyle = CS.sourd; x.textAlign = 'center';

  lignes.forEach((t, i) => { const y = Y(i), x0 = X(t.apparu), x1 = X(t.eteint ?? c1);
    if (t.parent && rang.has(t.parent)) { x.strokeStyle = CS.sourd; x.lineWidth = 1; x.setLineDash([2, 3]); x.beginPath(); x.moveTo(x0, Y(rang.get(t.parent))); x.lineTo(x0, y); x.stroke(); x.setLineDash([]); }
    x.strokeStyle = couleur(t.id); x.lineWidth = 4; x.lineCap = 'round'; x.beginPath(); x.moveTo(x0, y); x.lineTo(Math.max(x0 + 2, x1), y); x.stroke();

    const lib = `${nomEsp(t)}  ${nb(effectif(t))}`, droite = x0 > w * .55; x.font = 'italic 13px ' + getComputedStyle(document.body).getPropertyValue('--serif'); x.fillStyle = CS.texte; x.textAlign = droite ? 'right' : 'left'; x.fillText(lib, droite ? x0 - 8 : x0 + 4, y - 7); x.font = '12px system-ui, sans-serif'; });

// === CHAÎNE ALIMENTAIRE : qui mange qui, biome par biome ===
function vueChaine() {
  const I = inst(); if (!I.biomes.some(b => b.id === E.biome)) E.biome = I.biomes.slice().sort((a, b) => vivants(I).filter(t => t.populations.some(p => p.biome === b.id)).length - vivants(I).filter(t => t.populations.some(p => p.biome === a.id)).length)[0]?.id;

    <canvas id="cChaine" height="${innerWidth < 600 ? 560 : 460}"></canvas><p class="note">De gauche à droite, la masse des bêtes (échelle logarithmique) ; de bas en haut, herbivores, omnivores, carnivores. La taille d'un disque dit la biomasse, son anneau la satiété d'un prédateur ; une flèche va du mangeur à ce qu'il mange, plus épaisse s'il en mange plus. Touchez une espèce pour l'ouvrir ; seules les plus grandes biomasses sont nommées sur le dessin.</p><h3>Qui mange qui</h3><ul class="mange" id="mange"></ul>`;
  $('#choixBiome').value = E.biome; $('#choixBiome').onchange = e => { E.biome = e.target.value; vueChaine(); };
  const c = $('#cChaine'), [x, w, h] = toile(c), m = { g: 74, d: 20, h: 26, b: 40 };
  const N = []; for (const t of vivants(I)) { const p = t.populations.find(q => q.biome === E.biome); if (!p || p.effectif < 1) continue;
    N.push({ t, p, masse: t.plan.masse_kg || 1, bio: p.effectif * (t.plan.masse_kg || 1), niv: { herbivore: 0, filtreur: 0, detritivore: .2, omnivore: 1, carnivore: 2 }[t.plan.regime] ?? 1 }); }
  if (!N.length) { x.fillStyle = CS.sourd; x.fillText('Personne ne vit ici.', m.g, 40); return; }
  const lm = N.map(n => Math.log10(n.masse)), l0 = Math.min(...lm) - .15, l1 = Math.max(...lm) + .15, bmax = Math.max(...N.map(n => n.bio));
  N.forEach((n, i) => { n.x = m.g + (w - m.g - m.d) * (lm[i] - l0) / (l1 - l0); n.y = h - m.b - (h - m.h - m.b) * (n.niv / 2); n.r = 6 + 20 * Math.sqrt(n.bio / bmax); });
  for (let it = 0; it < 60; it++) for (const a of N) for (const b of N) { if (a === b) continue; const d = Math.hypot(a.x - b.x, a.y - b.y), min = a.r + b.r + 18; if (d < min && d > 0) { const k = (min - d) / 2; a.y -= Math.sign(b.y - a.y || 1) * k * .5; b.y += Math.sign(b.y - a.y || 1) * k * .5; } }
  for (const n of N) n.y = Math.max(m.h + n.r, Math.min(h - m.b - n.r, n.y));
  x.strokeStyle = CS.grille; x.beginPath(); for (const v of [0, 1, 2]) { const y = h - m.b - (h - m.h - m.b) * v / 2; x.moveTo(m.g, y); x.lineTo(w - m.d, y); } x.stroke();
  x.fillStyle = CS.sourd; x.textAlign = 'left'; x.fillText('herbivores', 4, h - m.b + 4); x.fillText('omnivores', 4, (h - m.b + m.h) / 2 + 4); x.fillText('carnivores', 4, m.h + 4);
  x.lineCap = 'round';

    const proies = N.filter(q => q !== p).map(q => ({ q, w: Orvane.appetence(p.t.plan, q.t.plan) * q.bio })).filter(e => e.w > 0).sort((a, b) => b.w - a.w), tot = proies.reduce((s, e) => s + e.w, 0); if (!tot) continue;
    for (const e of proies.slice(0, 3)) { const part = e.w / tot, dx = e.q.x - p.x, dy = e.q.y - p.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d, x0 = p.x + ux * p.r, y0 = p.y + uy * p.r, x1 = e.q.x - ux * (e.q.r + 6), y1 = e.q.y - uy * (e.q.r + 6);
      x.strokeStyle = couleur(p.t.id) + 'aa'; x.lineWidth = 1 + 5 * part; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke();

  for (const n of N.slice().sort((a, b) => b.bio - a.bio)) { if (!n.lib) continue; const lw = x.measureText(nomEsp(n.t)).width + 6;
    for (const dy of [13, 26, 39]) { const r = [n.x - lw / 2, n.y + n.r + dy - 11, lw, 14]; if (poses.some(q => r[0] < q[0] + q[2] && q[0] < r[0] + r[2] && r[1] < q[1] + q[3] && q[1] < r[1] + r[3])) continue; poses.push(r); x.fillText(nomEsp(n.t), n.x, n.y + n.r + dy); break; } }

    <div class="actions"><button class="bouton" id="bLot">Choisir un lot…</button><button class="bouton" id="bProfil">Choisir un profil…</button><button class="bouton" id="bExLot">Prendre ceux de l'exemple</button>${E.lot ? '<button class="bouton" id="bSansLot">Ne plus rejouer</button>' : ''}</div>
    <div class="champ"><label for="comptes">Joueurs</label><input type="range" id="comptes" min="1" max="100" value="${K}"><b id="vComptes">${K}</b></div>
    <p class="note">${E.lot && E.profil ? `Lot de « ${ESC(E.lot.source?.jeu || '?')} » (${E.lot.evenements.length} événements) et profil « ${ESC(E.profil.jeu)} » : rejoués pour ${K} joueurs à chaque cycle.` : E.lot ? 'Lot choisi : il manque le profil du jeu.' : E.profil ? `Profil « ${ESC(E.profil.jeu)} » chargé ; sans lot, le monde vit sans joueurs.` : 'Sans lot, le monde vit sans joueurs.'}</p>
    <h2>Pressions du dernier cycle simulé</h2><div id="vuePressions"></div>`;
  $$('[data-n]').forEach(b => b.onclick = () => simuler(+b.dataset.n));
  $('#arret').onclick = () => { E.arret = true; };
  if ($('#revenir')) $('#revenir').onclick = () => { E.H = E.H.slice(0, E.publies); E.tampon = {}; E.pressions = null; rendre(); };
  $('#bLot').onclick = () => $('#fLot').click(); $('#bProfil').onclick = () => $('#fProfil').click();
  $('#bExLot').onclick = async () => { try { const [a, b] = await Promise.all([json('../schemas/exemples/pression.json'), json('../schemas/exemples/profil.json')]); E.lot = a; E.profil = b; } catch (e) { E.lot = JSON.parse($('#exLot').textContent); E.profil = JSON.parse($('#exProfil').textContent); } E.tampon = {}; vueSimuler(); };
  if ($('#bSansLot')) $('#bSansLot').onclick = () => { E.lot = null; E.tampon = {}; vueSimuler(); };
  $('#comptes').oninput = e => { E.comptes = +e.target.value; $('#vComptes').textContent = e.target.value; };
  const P = E.pressions;
  if (!P || !P.taxons || !Object.keys(P.taxons).length) $('#vuePressions').innerHTML = '<p class="vide">Aucune pression au dernier cycle simulé.</p>';
  else { let h = '<div class="defile"><table><tr><th>espèce</th><th>biome</th><th>phénotype</th><th class="n">retirées</th></tr>';
    for (const [tid, Bs] of Object.entries(P.taxons)) for (const [bid, O] of Object.entries(Bs)) { for (const [k, v] of Object.entries(O.retrait || {})) h += `<tr><td>${ESC(nomEsp(inst().taxons.find(t => t.id === tid)) || tid)}</td><td>${ESC(nomBiome(bid))}</td><td>${k === '*' ? '<span class="sourd">toutes</span>' : ESC(k)}</td><td class="n ${v > 0 ? 'declin' : 'vif'}">${v > 0 ? '−' : '+'}${Math.abs(v).toFixed(1)}</td></tr>`;
      for (const d of O.deplacement || []) h += `<tr><td>${ESC(tid)}</td><td>${ESC(nomBiome(bid))}</td><td class="sourd">emportées vers ${ESC(nomBiome(d.vers))}</td><td class="n">${d.n}</td></tr>`; }
    $('#vuePressions').innerHTML = h + '</table></div>'; }
}
async function simuler(n) {
  if (E.enCours || !E.H.length) return; E.enCours = true; E.arret = false;
  $$('[data-n]').forEach(b => b.disabled = true); const arr = $('#arret'); if (arr) arr.disabled = false;
  const t0 = performance.now(); let k = 0;
  try {
    for (; k < n && !E.arret; k++) {
      let pressions = {};
      if (E.lot && E.profil) { const K = E.comptes || 10, c = E.lot.source?.compte || 'compte';
        const lots = Array.from({ length: K }, (_, i) => ({ ...E.lot, instantane: inst().cycle.n, source: { ...E.lot.source, compte: `${c}#${i}` } }));
        const r = OrvaneTampon.agreger(lots, inst(), E.profil, E.tampon, E.gen0); pressions = r.pressions; E.tampon = r.etat; }
      E.H.push(Orvane.cycle(inst(), pressions)); E.pressions = pressions;
      const b = $('#barre'), a = $('#avance'); if (b) b.style.width = (100 * (k + 1) / n) + '%'; if (a) a.textContent = `Cycle ${inst().cycle.n} (${k + 1} sur ${n})…`; entete();
      await new Promise(r => setTimeout(r, 0));                  // la page respire entre deux cycles : on peut arrêter
    }
  } catch (e) { bandeau(`La simulation s'est arrêtée : ${ESC(e.message)}.`, 'erreur'); }
  E.enCours = false;
  if (E.vue === 'simuler') { vueSimuler(); $('#avance').textContent = `${k} cycle${k > 1 ? 's' : ''} simulé${k > 1 ? 's' : ''} en ${((performance.now() - t0) / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} s${E.arret ? ' (arrêté)' : ''}. Voir la vue d'ensemble pour les courbes.`; }
  bandeau(`Vous regardez une simulation : ${E.H.length - E.publies} cycle${E.H.length - E.publies > 1 ? 's' : ''} au-delà du monde ${E.source?.publie ? 'publié' : 'ouvert'}. <button id="bRevenir">Revenir au monde de départ</button>`, 'local');
  $('#bRevenir').onclick = () => { E.H = E.H.slice(0, E.publies); E.tampon = {}; E.pressions = null; bandeau(''); rendre(); };
}

// --- au démarrage ---
(function () {
  if (typeof Orvane === 'undefined') { $('#contenu').innerHTML = '<p class="vide">Le moteur ne se charge pas : ouvrez cette page depuis le dépôt Orvane (elle a besoin de ../moteur et ../tampon).</p>'; return; }
  const q = new URLSearchParams(location.search);
  if (q.get('vue')) E.vue = q.get('vue'); if (q.get('espece')) { E.espece = q.get('espece'); E.ouverte = true; }
  listeMondes().then(() => { const id = q.get('monde') || E.mondes[0]?.id; if (id) monde(id); else exemple(); });
})();
</script>
